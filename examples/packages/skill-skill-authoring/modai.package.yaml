apiVersion: modai.dev/v1
kind: Package
metadata:
  name: "@skills/skill-authoring"
  version: 1.0.0
  description: Crea skills pequeñas, descubribles, progresivas y verificables para agentes.
spec:
  category: skill
  contributes:
    skills:
      - name: skill-authoring
        path: content
        files:
          - SKILL.md
          - references/checklist.md
          - references/quality.md
    knowledge:
      - path: content/references/quality.md
        title: Calidad de una skill para agentes
        tags: [skills, progressive-disclosure, instrucciones]
