apiVersion: modai.dev/v1
kind: Package
metadata:
  name: "@skills/design-patterns"
  version: 1.0.0
  description: Diagnostica, selecciona, implementa y verifica patrones de diseño sin sobreingeniería.
spec:
  category: skill
  contributes:
    skills:
      - name: design-patterns
        path: content
        files:
          - SKILL.md
          - references/decision-guide.md
          - references/creational.md
          - references/structural.md
          - references/behavioral.md
          - references/verification.md
          - references/sources.md
    knowledge:
      - path: content/SKILL.md
        title: Selección responsable de patrones de diseño
        tags: [patrones, diseño, arquitectura, refactoring]
      - path: content/references/decision-guide.md
        title: Guía de decisión entre patrones similares
        tags: [patrones, decisiones, tradeoffs]
      - path: content/references/creational.md
        title: Patrones creacionales
        tags: [factory, builder, prototype, singleton]
      - path: content/references/structural.md
        title: Patrones estructurales
        tags: [adapter, bridge, composite, decorator, facade, flyweight, proxy]
      - path: content/references/behavioral.md
        title: Patrones de comportamiento
        tags: [strategy, state, observer, command, mediator, visitor]
