apiVersion: modai.dev/v1
kind: Package
metadata:
  name: "@methodologies/sdd"
  version: 1.0.1
  description: Flujo ligero de desarrollo guiado por especificaciones.
spec:
  category: methodology
  permissions:
    - project.files
  contributes:
    skills:
      - name: sdd
        path: content
        files: [SKILL.md]
    files:
      - source: content/README.md
        target: docs/specs/README.md
