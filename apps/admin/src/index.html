<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>MODAI · Panel de administración</title>
    <link rel="icon" href="/admin/assets/favicon.svg" type="image/svg+xml" />
    <script src="/admin/assets/theme.js"></script>
    <link rel="stylesheet" href="/admin/assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <div id="boot" class="boot" role="status">
      <span class="logo-mark" aria-hidden="true">M</span>
      <span class="spinner" aria-hidden="true"></span>
      <span>Cargando MODAI…</span>
    </div>

    <div id="authScreen" class="auth-screen" hidden></div>

    <div id="appShell" class="app" hidden>
      <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
        <div class="sidebar-head">
          <a class="brand" href="#/dashboard">
            <span class="logo-mark" aria-hidden="true">M</span>
            <span class="brand-name">MODAI</span>
            <span class="brand-version" id="brandVersion"></span>
          </a>
          <button class="icon-button sidebar-close" type="button" data-close-menu aria-label="Cerrar menú">
            <i data-icon="x"></i>
          </button>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="sidebar-foot" id="serverStatus"></div>
      </aside>
      <div class="backdrop" data-close-menu></div>

      <div class="main-column">
        <header class="topbar">
          <button class="icon-button menu-toggle" id="menuToggle" type="button" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
            <i data-icon="menu"></i>
          </button>
          <!-- biome-ignore lint/a11y/useAriaPropsSupportedByRole: kept as in the published panel -->
          <div class="crumbs" aria-label="Ubicación">
            <span id="crumbSection" class="crumb-section"></span>
            <span class="crumb-sep" aria-hidden="true">/</span>
            <span id="crumbPage" class="crumb-page"></span>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" id="refreshButton" type="button" aria-label="Actualizar datos" title="Actualizar datos">
              <i data-icon="refresh"></i>
            </button>
            <label class="sr-only" for="themeSelect">Tema de apariencia</label>
            <select id="themeSelect" class="theme-select" title="Tema de apariencia">
              <option value="system">Sistema</option>
              <option value="light">Claro</option>
              <option value="dark">Oscuro</option>
            </select>
            <div class="user-menu">
              <button id="userButton" class="user-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenu">
                <span class="avatar" id="userAvatar" aria-hidden="true">?</span>
                <span class="user-text">
                  <span class="user-name" id="userName"></span>
                  <span class="user-role" id="userRole"></span>
                </span>
                <i data-icon="chevronDown"></i>
              </button>
              <div class="menu" id="userMenu" role="menu" aria-labelledby="userButton" hidden>
                <div class="menu-header" id="userMenuHeader"></div>
                <button type="button" role="menuitem" data-menu="password"><i data-icon="lock"></i>Cambiar contraseña</button>
                <button type="button" role="menuitem" data-menu="connect"><i data-icon="terminal"></i>Conectar la CLI</button>
                <button type="button" role="menuitem" data-menu="keys"><i data-icon="key"></i>Mis API keys</button>
                <hr />
                <button type="button" role="menuitem" data-menu="logout" class="danger-text"><i data-icon="logout"></i>Cerrar sesión</button>
              </div>
            </div>
          </div>
        </header>

        <main id="main" class="content" tabindex="-1">
          <div class="page-head">
            <div>
              <!-- biome-ignore lint/a11y/useHeadingContent: filled by the router -->
              <h1 id="pageTitle"></h1>
              <p id="pageSubtitle"></p>
            </div>
            <div class="page-actions" id="pageActions"></div>
          </div>
          <div id="viewRoot"></div>
        </main>
      </div>
    </div>

    <dialog id="dialog" class="dialog" aria-labelledby="dialogTitle" aria-describedby="dialogDescription">
      <header class="dialog-head">
        <div>
          <!-- biome-ignore lint/a11y/useHeadingContent: filled by openDialog -->
          <h2 id="dialogTitle"></h2>
          <p id="dialogDescription" hidden></p>
        </div>
        <button class="icon-button dialog-close" type="button" aria-label="Cerrar diálogo"><i data-icon="x"></i></button>
      </header>
      <div id="dialogBody" class="dialog-body"></div>
    </dialog>

    <div id="toasts" class="toasts"></div>
    <noscript><p class="noscript">El panel de MODAI necesita JavaScript.</p></noscript>
    <script type="module" src="/admin/assets/main.js"></script>
  </body>
</html>
