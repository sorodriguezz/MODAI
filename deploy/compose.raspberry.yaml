services:
  server:
    image: ${MODAI_IMAGE:-modularai:local}
    restart: always
    mem_limit: ${MODAI_MEMORY_LIMIT:-768m}
    environment:
      NODE_OPTIONS: "--max-old-space-size=${MODAI_NODE_HEAP_MB:-384}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
