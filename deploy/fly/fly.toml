app = "modai"
primary_region = "gru"

[env]
  MODAI_HOST = "0.0.0.0"
  MODAI_PORT = "8787"
  MODAI_DATABASE_PATH = "/app/data/modularai.db"
  MODAI_ARTIFACT_DIR = "/app/data/artifacts"
  MODAI_TRUST_PROXY = "true"
  MODAI_SIGNATURE_POLICY = "optional"

[[mounts]]
  source = "modai_data"
  destination = "/app/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
