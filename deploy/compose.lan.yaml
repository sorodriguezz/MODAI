services:
  server:
    environment:
      # Caddy reenvía las peticiones: confía en su cabecera X-Forwarded-For y protocolo.
      MODAI_TRUST_PROXY: "true"
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      MODAI_HOSTNAME: "${MODAI_HOSTNAME:-modai.local}"
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
